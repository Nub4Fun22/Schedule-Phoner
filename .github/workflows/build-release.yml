name: Build & Release Android APK

# WHAT THIS DOES
# --------------
# * On every push to `main`  -> builds the APK and updates a "latest" release
#                               so there is always an up-to-date downloadable
#                               APK reflecting your newest fixes/features.
# * On every version tag v*  -> builds the APK and publishes a versioned
#                               release (e.g. v1.2.0) that stays around.
# * Manual run (Actions tab) -> builds on demand.
#
# The downloadable APK always appears on the repo's "Releases" page.

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

# Needed so the workflow can create/update Releases and upload the APK.
permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          # Pinned to a stable Flutter that bundles Android Gradle Plugin 8.x.
          # (The very latest Flutter pulls AGP 9, whose "new DSL" breaks some
          # plugins like flutter_local_notifications/flutter_timezone.)
          flutter-version: '3.24.5'

      - name: Generate Android platform files
        run: flutter create . --project-name school_schedule --platforms=android

      - name: Apply Android native overlay (home-screen widget)
        # Copies committed native widget files (Kotlin provider + res/ layouts)
        # into the freshly generated android/ tree. Uses cp -r so it merges.
        run: |
          if [ -d android_overlay ]; then
            echo "Applying android_overlay/ -> android/"
            cp -rv android_overlay/* android/
          else
            echo "No android_overlay/ to apply"
          fi

      - name: Force compileSdk/targetSdk to 35
        # androidx.work (via home_widget) requires compileSdk >= 35, but the
        # Flutter 3.24.5 template defaults to 34. Patch the app module.
        run: |
          set -e
          for f in android/app/build.gradle android/app/build.gradle.kts; do
            [ -f "$f" ] || continue
            # compileSdk 34 / compileSdkVersion 34  ->  35
            sed -i -E 's/(compileSdk(Version)?[[:space:]]*=?[[:space:]]*)(34|flutter\.compileSdkVersion)/\135/g' "$f"
            # targetSdk 34 / targetSdkVersion 34  ->  35
            sed -i -E 's/(targetSdk(Version)?[[:space:]]*=?[[:space:]]*)(34|flutter\.targetSdkVersion)/\135/g' "$f"
            echo "----- $f (sdk lines) -----"
            grep -nE "compileSdk|targetSdk" "$f" || true
          done

      - name: Pin androidx.work to an AGP-8.3-compatible version
        # home_widget transitively pulls androidx.work 2.11.x, which demands
        # AGP 8.6+ (newer than Flutter 3.24.5 ships). Force work back to 2.9.0,
        # which is compatible with the bundled AGP and compileSdk 35.
        run: |
          set -e
          f=android/app/build.gradle
          if [ -f "$f" ]; then
            {
              printf '\n'
              printf '// Injected by CI: keep androidx.work compatible with the bundled AGP.\n'
              printf 'configurations.all {\n'
              printf '    resolutionStrategy {\n'
              printf "        force 'androidx.work:work-runtime:2.9.0'\n"
              printf "        force 'androidx.work:work-runtime-ktx:2.9.0'\n"
              printf '    }\n'
              printf '}\n'
            } >> "$f"
            echo "Appended androidx.work resolutionStrategy to $f"
            tail -12 "$f"
          fi

      - name: Bump Kotlin Gradle plugin to 2.1.0
        # home_widget's precompiled deps use Kotlin metadata 2.1.0, but the
        # Flutter-generated project pins an older Kotlin compiler (1.8.x) that
        # can't read them. Force the Kotlin Android plugin to 2.1.0.
        run: |
          set -e
          for f in android/settings.gradle.kts android/settings.gradle android/build.gradle android/build.gradle.kts; do
            [ -f "$f" ] || continue
            # Matches: id("org.jetbrains.kotlin.android") version "1.8.22"
            #      or: id "org.jetbrains.kotlin.android" version "1.8.22"
            sed -i -E 's/(org\.jetbrains\.kotlin\.android"?\)?[[:space:]]+version[[:space:]]+")[0-9]+\.[0-9]+\.[0-9]+(")/\12.1.0\2/g' "$f"
            # Matches: ext.kotlin_version = '1.8.22'
            sed -i -E "s/(kotlin_version[[:space:]]*=[[:space:]]*['\"])[0-9]+\.[0-9]+\.[0-9]+(['\"])/\12.1.0\2/g" "$f"
            echo "----- $f (kotlin lines) -----"
            grep -nE "kotlin" "$f" || true
          done

      - name: Get dependencies
        run: flutter pub get

      - name: Generate launcher icons (if source image present)
        run: |
          if [ -f assets/icon/app_icon.png ]; then
            echo "Found app_icon.png — generating launcher icons"
            dart run flutter_launcher_icons
          else
            echo "No assets/icon/app_icon.png found — keeping default icon"
          fi

      - name: Build release APK
        run: flutter build apk --release

      - name: Rename APK
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/schedule-phoner.apk
          ls -lh dist

      # Always keep a rolling "latest" release updated from main pushes.
      - name: Publish/refresh the "latest" release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          body: |
            Automatically built from the latest code on `main`.
            Download **schedule-phoner.apk** below and open it on your Android
            phone to install (allow "install from unknown sources" if asked).
          files: dist/schedule-phoner.apk
          fail_on_unmatched_files: true

      # Versioned, permanent releases when you push a tag like v1.2.0.
      - name: Publish versioned release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/schedule-phoner.apk
          fail_on_unmatched_files: true
          generate_release_notes: true

      - name: Upload APK as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: schedule-phoner-apk
          path: dist/schedule-phoner.apk
