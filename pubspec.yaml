name: school_schedule
description: A clean school timetable app with weekly grid and day views, event details, and per-event/all notifications.
publish_to: 'none'
version: 2.8.2+14

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  # Local notifications (single event + all events)
  flutter_local_notifications: ^17.2.3
  # Timezone-aware scheduling required by flutter_local_notifications
  timezone: ^0.9.4
  # 3.x builds cleanly against the modern Android toolchain. Its
  # getLocalTimezone() returns a TimezoneInfo object; we read the name
  # defensively at runtime so it also tolerates String-returning versions.
  flutter_timezone: ^3.0.1
  # Simple state management
  provider: ^6.1.2
  # Local persistence for events and settings
  shared_preferences: ^2.3.2
  # Android/iOS home-screen widgets (native widget code required).
  # Pinned to 0.9.2+1 for compatibility with the CI's Flutter 3.24.5.
  home_widget: 0.9.2+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  # Generates all Android launcher icon sizes from a single source PNG.
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true

# App launcher icon configuration.
# Source image lives at assets/icon/app_icon.png (the burning calendar).
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.png"
  # Adaptive icon (Android 8+): dark ember background + a padded foreground so
  # the burning calendar isn't cropped by the system's rounded icon mask.
  adaptive_icon_background: "#1A1207"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  min_sdk_android: 21
